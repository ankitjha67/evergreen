services:
  - type: web
    name: evergreen
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: MIGRATION_PROVIDER
        value: anthropic
      - key: AUTO_MIGRATE
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: NODE_ENV
        value: production
